<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grammi Watch</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #000000;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px 10px;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* Top Bar */
    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .brand-icon {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: linear-gradient(135deg, #0d9488, #2dd4bf);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon svg {
      width: 11px;
      height: 11px;
      fill: #020617;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 600;
      color: #2dd4bf;
      background: rgba(45, 212, 191, 0.12);
      padding: 2px 6px;
      border-radius: 10px;
      letter-spacing: 0.2px;
    }

    /* Stepper Container */
    .stepper-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 6px 0;
    }

    .step-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #141c2b;
      border: 1.5px solid #243247;
      color: #2dd4bf;
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      transition: transform 0.08s ease, background-color 0.1s ease;
      flex-shrink: 0;
    }

    .step-btn:active {
      transform: scale(0.90);
      background: #1e293b;
      border-color: #2dd4bf;
    }

    .step-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Value Display */
    .display-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0f17;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 6px 2px;
      min-height: 58px;
    }

    .value-num {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
    }

    .value-unit {
      font-size: 10px;
      font-weight: 800;
      color: #2dd4bf;
      text-transform: uppercase;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      height: 44px;
      border-radius: 22px;
      background: linear-gradient(135deg, #0d9488 0%, #14b8a6 50%, #2dd4bf 100%);
      border: none;
      color: #020617;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(20, 184, 166, 0.35);
      transition: transform 0.1s ease, filter 0.15s ease;
      margin-top: 4px;
    }

    .submit-btn:active {
      transform: scale(0.94);
      filter: brightness(1.15);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .submit-btn.success {
      background: #10b981;
      color: #ffffff;
    }

    /* Sub-info / Daily sum */
    .today-summary {
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
      text-align: center;
      margin-top: 6px;
      letter-spacing: 0.2px;
    }

    .today-summary span {
      color: #f1f5f9;
      font-weight: 800;
    }

    /* Auth state notice */
    .auth-overlay {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      padding: 10px 4px;
    }

    .auth-overlay.active {
      display: flex;
    }

    .auth-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }

    .auth-desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.3;
    }

    .auth-input {
      width: 100%;
      height: 36px;
      background: #141c2b;
      border: 1px solid #243247;
      border-radius: 10px;
      color: #ffffff;
      font-size: 12px;
      padding: 0 10px;
      outline: none;
    }

    .auth-input:focus {
      border-color: #2dd4bf;
    }

    .link-subtle {
      font-size: 10px;
      color: #64748b;
      text-decoration: none;
      margin-top: 6px;
      display: block;
      text-align: center;
    }

    /* Spinner */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(2, 6, 23, 0.3);
      border-top-color: #020617;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 512 512">
          <path d="M504.3 11.1C493.3-1.6 474.5-3.7 461 6.2L252.3 160l144.9 0L502.6 54.6c11.8-11.8 12.6-30.8 1.6-43.5zM32 192c-17.7 0-32 14.3-32 32s14.3 32 32 32c0 82.5 43.4 147.7 123.9 176.2c-11.1 13.9-19.4 30.3-23.9 48.1C127.6 497.4 142.3 512 160 512l192 0c17.7 0 32.4-14.6 28.1-31.7c-4.5-17.8-12.8-34.1-23.9-48.1C436.6 403.7 480 338.5 480 256c17.7 0 32-14.3 32-32s-14.3-32-32-32L32 192z"/>
        </svg>
      </div>
      <span>Grammi</span>
    </div>
    <div id="statusBadge" class="status-badge">Připraven</div>
  </div>

  <!-- AUTH FORM (IF LOGGED OUT) -->
  <div id="authSection" class="auth-overlay">
    <div class="auth-title">Přihlášení</div>
    <div class="auth-desc">Zadejte e-mail a heslo pro přístup z Apple Watch:</div>
    <input type="email" id="watchEmail" class="auth-input" placeholder="E-mail" autocomplete="email">
    <input type="password" id="watchPassword" class="auth-input" placeholder="Heslo" autocomplete="current-password">
    <button id="watchLoginBtn" class="submit-btn" onclick="handleWatchLogin()">Přihlásit se</button>
    <a href="index.html" class="link-subtle">Otevřít telefonní web</a>
  </div>

  <!-- MAIN DOSING VIEW (IF LOGGED IN) -->
  <div id="mainSection" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
    
    <!-- STEPPER -->
    <div class="stepper-container">
      <button class="step-btn" id="btnMinus" onclick="adjustAmount(-0.10)" aria-label="Snížit o 0.1 G">
        <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
      </button>

      <div class="display-box">
        <div id="doseValue" class="value-num">1.50</div>
        <div class="value-unit">Gramů (G)</div>
      </div>

      <button class="step-btn" id="btnPlus" onclick="adjustAmount(0.10)" aria-label="Zvýšit o 0.1 G">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
    </div>

    <!-- SUBMIT BUTTON -->
    <button id="saveBtn" class="submit-btn" onclick="submitWatchDose()">
      <span id="btnLabel">ZAPSAT DÁVKU</span>
    </button>

    <!-- TODAY SUMMARY -->
    <div class="today-summary">
      Dnes: <span id="todayTotal">0.00 G</span>
    </div>

    <a href="dashboard.html" class="link-subtle">Dashboard</a>
  </div>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://emzqqvoqqodaggskgfze.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_rYu-TFnQacUrnmdNVRZ3Zw_wR3r_u4W";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        storage: window.localStorage,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    let currentAmount = 1.50;
    let currentUserId = null;
    let isSubmitting = false;

    // Tactile haptic feedback helper
    function haptic(ms) {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(ms || 15);
      }
    }

    // Stepper logic (0.10 G increment/decrement)
    function adjustAmount(delta) {
      if (isSubmitting) return;
      haptic(15);
      
      let next = Math.round((currentAmount + delta) * 100) / 100;
      if (next < 0.10) next = 0.10;
      if (next > 50.00) next = 50.00;
      
      currentAmount = next;
      updateDisplay();
      localStorage.setItem('grammi_watch_last_amount', currentAmount.toFixed(2));
    }

    function updateDisplay() {
      const el = document.getElementById('doseValue');
      if (el) el.textContent = currentAmount.toFixed(2);
    }

    // Load initial amount from localStorage if previously set
    const savedAmount = parseFloat(localStorage.getItem('grammi_watch_last_amount'));
    if (!isNaN(savedAmount) && savedAmount >= 0.10) {
      currentAmount = savedAmount;
      updateDisplay();
    }

    // Initialize session and data
    async function initWatch() {
      try {
        const { data: { session }, error } = await db.auth.getSession();
        if (error || !session) {
          showAuthSection();
          return;
        }

        currentUserId = session.user.id;
        showMainSection();
        loadTodaySummary();
      } catch (err) {
        console.error('Watch init error:', err);
        showAuthSection();
      }
    }

    function showAuthSection() {
      document.getElementById('authSection').classList.add('active');
      document.getElementById('mainSection').style.display = 'none';
      document.getElementById('statusBadge').textContent = 'Nepřihlášen';
      document.getElementById('statusBadge').style.color = '#f87171';
      document.getElementById('statusBadge').style.background = 'rgba(248, 113, 113, 0.15)';
    }

    function showMainSection() {
      document.getElementById('authSection').classList.remove('active');
      document.getElementById('mainSection').style.display = 'flex';
      document.getElementById('statusBadge').textContent = 'Připraven';
      document.getElementById('statusBadge').style.color = '#2dd4bf';
      document.getElementById('statusBadge').style.background = 'rgba(45, 212, 191, 0.12)';
    }

    // Watch login handler
    async function handleWatchLogin() {
      const email = document.getElementById('watchEmail').value.trim();
      const password = document.getElementById('watchPassword').value;
      const btn = document.getElementById('watchLoginBtn');

      if (!email || !password) {
        alert('Vyplňte e-mail i heslo.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Ověřuji...';

      try {
        const { data, error } = await db.auth.signInWithPassword({ email, password });
        if (error) {
          alert('Chyba přihlášení: ' + error.message);
          btn.disabled = false;
          btn.textContent = 'Přihlásit se';
          return;
        }

        currentUserId = data.user.id;
        showMainSection();
        loadTodaySummary();
      } catch (err) {
        alert('Chyba: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Přihlásit se';
      }
    }

    // Load today's doses summary
    async function loadTodaySummary() {
      if (!currentUserId) return;

      const now = new Date();
      const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();

      try {
        const { data, error } = await db
          .from('doses')
          .select('amount')
          .eq('user_id', currentUserId)
          .gte('timestamp', startOfDay);

        if (!error && data) {
          const total = data.reduce((sum, d) => sum + (parseFloat(d.amount) || 0), 0);
          document.getElementById('todayTotal').textContent = total.toFixed(2) + ' G';
        }
      } catch (e) {
        console.error('Failed to load today total:', e);
      }
    }

    // Submit Dose to Supabase
    async function submitWatchDose() {
      if (!currentUserId) {
        showAuthSection();
        return;
      }
      if (isSubmitting) return;

      isSubmitting = true;
      haptic(30);

      const saveBtn = document.getElementById('saveBtn');
      const btnLabel = document.getElementById('btnLabel');

      saveBtn.disabled = true;
      btnLabel.innerHTML = '<span class="spinner"></span> Ukládám...';

      const doseAmount = parseFloat(currentAmount.toFixed(2));
      const payload = {
        amount: doseAmount,
        note: 'Apple Watch',
        timestamp: new Date().toISOString(),
        user_id: currentUserId,
        latitude: null,
        longitude: null
      };

      try {
        const { error } = await db.from('doses').insert([payload]);

        if (error) throw error;

        // Success state
        haptic([30, 40, 30]);
        saveBtn.classList.add('success');
        btnLabel.innerHTML = '✓ Uloženo!';

        loadTodaySummary();

        setTimeout(() => {
          saveBtn.classList.remove('success');
          btnLabel.textContent = 'ZAPSAT DÁVKU';
          saveBtn.disabled = false;
          isSubmitting = false;
        }, 1600);

      } catch (err) {
        console.error('Submit error:', err);
        haptic([80, 50, 80]);
        btnLabel.textContent = 'Chyba!';
        setTimeout(() => {
          btnLabel.textContent = 'ZAPSAT DÁVKU';
          saveBtn.disabled = false;
          isSubmitting = false;
        }, 1800);
      }
    }

    // Start on DOM ready
    document.addEventListener('DOMContentLoaded', initWatch);
  </script>
</body>
</html>
