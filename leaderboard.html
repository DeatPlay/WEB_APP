<!DOCTYPE html>
<html lang="cs" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="view-transition" content="same-origin">
  <title>Leaderboard | Grammi</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              900: '#134e4a',
            },
            gold: '#fbbf24',
            silver: '#94a3b8',
            bronze: '#d97706',
            darkbg: '#0b0f17',
            cardbg: '#141c2b',
            borderbg: '#1e293b'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f17;
      color: #f1f5f9;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      display: none;
    }

    .page-slide-in-right {
      animation: slideInFromRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideInFromRight {
      from {
        transform: translateX(35px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .page-slide-out-right {
      transform: translateX(35px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #141c2b;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    .liquid-glass-nav {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.6);
    }

    .liquid-pill {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.95) 0%, rgba(217, 119, 6, 0.9) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.45);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, rgba(11, 15, 23, 0) 70%);
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .rank-badge-bronze {
      background: rgba(217, 119, 6, 0.12);
      border-color: rgba(217, 119, 6, 0.35);
      color: #f59e0b;
      box-shadow: 0 0 8px rgba(217, 119, 6, 0.25);
    }
    .rank-badge-silver {
      background: rgba(148, 163, 184, 0.12);
      border-color: rgba(148, 163, 184, 0.35);
      color: #cbd5e1;
      box-shadow: 0 0 8px rgba(148, 163, 184, 0.25);
    }
    .rank-badge-gold {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.45);
      color: #fbbf24;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }
    .rank-badge-platina {
      background: rgba(45, 212, 191, 0.15);
      border-color: rgba(45, 212, 191, 0.45);
      color: #2dd4bf;
      box-shadow: 0 0 12px rgba(45, 212, 191, 0.35);
    }
    .rank-badge-diamond {
      background: rgba(168, 85, 247, 0.18);
      border-color: rgba(192, 132, 252, 0.55);
      color: #c084fc;
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.4);
    }

    .details-accordion {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .details-accordion.open {
      grid-template-rows: 1fr;
    }
    .details-inner {
      overflow: hidden;
      opacity: 0;
      transform: translateY(-3px);
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .details-accordion.open .details-inner {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.25s ease 0.04s, transform 0.25s cubic-bezier(0.4, 0, 0.2, 1) 0.04s;
    }
  </style>
</head>
<body id="main-body" class="h-dvh flex justify-center p-2.5 pb-6 sm:p-4 sm:pb-7 select-none antialiased relative">

  <div class="ambient-glow"></div>

  <div id="leaderboard-wrapper" class="w-full max-w-md h-full flex flex-col justify-between gap-2.5 overflow-hidden relative z-10 page-slide-in-right">

    <header class="flex justify-between items-center py-1 px-0.5 shrink-0">
      <div class="flex items-center gap-2.5">
        <button onclick="navigateBack('dashboard.html?from=leaderboard')" class="w-9 h-9 rounded-xl bg-cardbg border border-borderbg flex items-center justify-center text-slate-300 hover:text-white transition-colors active:scale-95 shadow-md cursor-pointer" title="Zpět na Dashboard">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <div>
          <h1 class="font-extrabold text-lg tracking-tight text-white flex items-center gap-1.5 leading-none">
            Leaderboard
            <span class="text-amber-400 font-bold text-[10px] px-1.5 py-0.5 rounded-full bg-amber-500/10 border border-amber-500/20 flex items-center gap-1">
              <i class="fa-solid fa-crown text-[9px]"></i> TOP 10
            </span>
          </h1>
          <p class="text-[11px] text-slate-400 font-medium leading-tight mt-0.5">Celkové pořadí</p>
        </div>
      </div>

      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-slate-950 font-black text-sm shadow-lg shadow-amber-500/20">
        <i class="fa-solid fa-trophy"></i>
      </div>
    </header>

    <div class="liquid-glass-nav rounded-2xl p-1 relative grid grid-cols-2 gap-0 shrink-0">
      <div 
        id="sort-pill" 
        class="liquid-pill absolute top-1 bottom-1 left-1 w-[calc(50%-0.25rem)] rounded-xl pointer-events-none"
      ></div>

      <button 
        id="btn-sort-total" 
        onclick="setSortMode('total')" 
        class="relative z-10 py-2 rounded-xl font-black text-xs flex items-center justify-center gap-1.5 transition-colors duration-300 text-slate-950 cursor-pointer"
      >
        <i class="fa-solid fa-layer-group text-xs"></i> Celkem Gcek
      </button>

      <button 
        id="btn-sort-max" 
        onclick="setSortMode('max')" 
        class="relative z-10 py-2 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition-colors duration-300 text-slate-400 hover:text-white cursor-pointer"
      >
        <i class="fa-solid fa-bolt-lightning text-xs"></i> Max. Gcek
      </button>
    </div>

    <div class="bg-cardbg border border-borderbg rounded-2xl p-3 shadow-xl flex-1 flex flex-col overflow-hidden">
      
      <div class="flex justify-between items-center mb-2 pb-2 border-b border-borderbg/60 shrink-0 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
        <span>Uživatel & Pořadí</span>
        <span id="sort-indicator-label">Celkem (Max)</span>
      </div>

      <div id="leaderboard-list" class="space-y-1.5 flex-1 overflow-y-auto custom-scroll pr-1">
        <div class="text-center py-8 text-slate-500 text-xs flex flex-col items-center justify-center gap-2">
          <i class="fa-solid fa-spinner fa-spin text-lg text-amber-400"></i>
          Načítám žebříček z databáze...
        </div>
      </div>
    </div>

    <button 
      type="button"
      onclick="navigateBack('dashboard.html?from=leaderboard')" 
      class="w-full py-2.5 bg-darkbg hover:bg-slate-800/80 border border-borderbg rounded-2xl text-xs font-bold text-slate-300 flex items-center justify-center gap-2 transition-all active:scale-[0.98] shadow-md shrink-0 mb-1 cursor-pointer"
    >
      <i class="fa-solid fa-arrow-left text-brand-400 text-xs"></i> Zpět do přehledu
    </button>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://emzqqvoqqodaggskgfze.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_rYu-TFnQacUrnmdNVRZ3Zw_wR3r_u4W";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        storage: window.localStorage,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    let leaderboardData = [];
    let currentSort = 'total';
    let currentUserId = null;
    let expandedUserId = null;

    async function checkAuth() {
      const { data: { session }, error } = await db.auth.getSession();

      if (error || !session) {
        window.location.replace("index.html");
        return;
      }

      currentUserId = session.user.id;
      document.getElementById('main-body').style.display = 'flex';

      await loadLeaderboard();
    }

    function navigateBack(url) {
      const wrapper = document.getElementById('leaderboard-wrapper');
      wrapper.classList.remove('page-slide-in-right');
      wrapper.classList.add('page-slide-out-right');
      setTimeout(() => {
        window.location.href = url;
      }, 220);
    }

    function getUserRankBadgeHTML(totalGrams) {
      let rankName = "BRONZE";
      let rankIcon = "fa-shield";
      let badgeClass = "rank-badge-bronze";

      if (totalGrams <= 20) {
        rankName = "BRONZE";
        rankIcon = "fa-shield";
        badgeClass = "rank-badge-bronze";
      } else if (totalGrams <= 50) {
        rankName = "SILVER";
        rankIcon = "fa-medal";
        badgeClass = "rank-badge-silver";
      } else if (totalGrams <= 100) {
        rankName = "GOLD";
        rankIcon = "fa-crown";
        badgeClass = "rank-badge-gold";
      } else if (totalGrams <= 500) {
        rankName = "PLATINA";
        rankIcon = "fa-gem";
        badgeClass = "rank-badge-platina";
      } else {
        rankName = "DIAMOND";
        rankIcon = "fa-bolt-lightning";
        badgeClass = "rank-badge-diamond";
      }

      return `
        <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md border text-[9px] font-black uppercase tracking-wider ${badgeClass}">
          <i class="fa-solid ${rankIcon} text-[8px]"></i> ${rankName}
        </span>
      `;
    }

    async function loadLeaderboard() {
      try {
        const { data: { session } } = await db.auth.getSession();
        if (session) {
          currentUserId = session.user.id;
        }

        const { data, error } = await db
          .from('leaderboard_view')
          .select('user_id, display_name, avatar_url, total_grams, max_dose, dose_count, recent_doses');

        if (error) throw error;

        leaderboardData = (data || []).map(row => ({
          id: row.user_id,
          name: row.display_name || 'Anonym',
          avatarUrl: row.avatar_url || '',
          totalGrams: parseFloat(row.total_grams) || 0,
          maxDose: parseFloat(row.max_dose) || 0,
          recentDoses: Array.isArray(row.recent_doses) ? row.recent_doses : [],
          isCurrent: row.user_id === currentUserId
        }));

        renderLeaderboard();
      } catch (err) {
        console.error('Chyba načítání žebříčku:', err);
        document.getElementById('leaderboard-list').innerHTML = `
          <div class="text-center py-6 text-red-400 text-xs flex flex-col items-center justify-center gap-1.5">
            <i class="fa-solid fa-triangle-exclamation text-base"></i>
            Nepodařilo se načíst data žebříčku.
          </div>
        `;
      }
    }

    function setSortMode(mode) {
      currentSort = mode;
      const pill = document.getElementById('sort-pill');
      const btnTotal = document.getElementById('btn-sort-total');
      const btnMax = document.getElementById('btn-sort-max');
      const sortLabel = document.getElementById('sort-indicator-label');

      if (mode === 'total') {
        pill.style.transform = 'translateX(0%)';
        btnTotal.className = "relative z-10 py-2 rounded-xl font-black text-xs flex items-center justify-center gap-1.5 transition-colors duration-300 text-slate-950 cursor-pointer";
        btnMax.className = "relative z-10 py-2 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition-colors duration-300 text-slate-400 hover:text-white cursor-pointer";
        sortLabel.textContent = "Celkem (Max)";
      } else {
        pill.style.transform = 'translateX(100%)';
        btnMax.className = "relative z-10 py-2 rounded-xl font-black text-xs flex items-center justify-center gap-1.5 transition-colors duration-300 text-slate-950 cursor-pointer";
        btnTotal.className = "relative z-10 py-2 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition-colors duration-300 text-slate-400 hover:text-white cursor-pointer";
        sortLabel.textContent = "Max (Celkem)";
      }

      renderLeaderboard();
    }

    function toggleUserDetails(userId) {
      const isExpanding = expandedUserId !== userId;

      if (expandedUserId && expandedUserId !== userId) {
        const prevAcc = document.getElementById(`acc-${expandedUserId}`);
        const prevChev = document.getElementById(`chev-${expandedUserId}`);
        if (prevAcc) prevAcc.classList.remove('open');
        if (prevChev) prevChev.classList.remove('rotate-180');
      }

      expandedUserId = isExpanding ? userId : null;

      const currentAcc = document.getElementById(`acc-${userId}`);
      const currentChev = document.getElementById(`chev-${userId}`);

      if (isExpanding) {
        if (currentAcc) currentAcc.classList.add('open');
        if (currentChev) currentChev.classList.add('rotate-180');
      } else {
        if (currentAcc) currentAcc.classList.remove('open');
        if (currentChev) currentChev.classList.remove('rotate-180');
      }
    }

    function renderLeaderboard() {
      const container = document.getElementById('leaderboard-list');

      if (leaderboardData.length === 0) {
        container.innerHTML = `
          <div class="text-center py-6 text-slate-500 text-xs flex flex-col items-center justify-center gap-1.5">
            <i class="fa-solid fa-inbox text-lg"></i>
            Zatím žádní uživatelé nezapsali dávku.
          </div>
        `;
        return;
      }

      leaderboardData.sort((a, b) => {
        if (currentSort === 'total') {
          return b.totalGrams - a.totalGrams;
        } else {
          return b.maxDose - a.maxDose;
        }
      });

      const top10 = leaderboardData.slice(0, 10);

      container.innerHTML = top10.map((user, index) => {
        const rank = index + 1;
        
        let badgeStyle = "bg-slate-800 text-slate-400 border-borderbg";
        let cardBorder = "border-borderbg/80";
        let rankIcon = rank;

        if (rank === 1) {
          badgeStyle = "bg-amber-400/20 text-amber-300 border-amber-400/40 shadow-sm shadow-amber-500/20 font-black";
          cardBorder = "border-amber-400/40 bg-gradient-to-r from-amber-500/10 to-darkbg/80";
          rankIcon = `<i class="fa-solid fa-crown text-amber-400 text-[11px]"></i>`;
        } else if (rank === 2) {
          badgeStyle = "bg-slate-300/20 text-slate-200 border-slate-300/40 font-black";
          cardBorder = "border-slate-300/30 bg-gradient-to-r from-slate-400/10 to-darkbg/80";
          rankIcon = `<i class="fa-solid fa-medal text-slate-300 text-[11px]"></i>`;
        } else if (rank === 3) {
          badgeStyle = "bg-amber-700/20 text-amber-500 border-amber-700/40 font-black";
          cardBorder = "border-amber-700/30 bg-gradient-to-r from-amber-800/10 to-darkbg/80";
          rankIcon = `<i class="fa-solid fa-medal text-amber-600 text-[11px]"></i>`;
        }

        const youBadge = user.isCurrent ? `<span class="text-[9px] font-bold text-brand-400 bg-brand-500/15 border border-brand-500/30 px-1.5 py-0.2 rounded-md">TY</span>` : '';
        const rankBadgeHTML = getUserRankBadgeHTML(user.totalGrams);

        const primaryValue = currentSort === 'total' ? user.totalGrams.toFixed(2) : user.maxDose.toFixed(2);
        const secondaryValue = currentSort === 'total' ? user.maxDose.toFixed(2) : user.totalGrams.toFixed(2);
        const primaryUnit = currentSort === 'total' ? 'g celkem' : 'g max';
        const secondaryLabel = currentSort === 'total' ? `max: ${secondaryValue}g` : `celkem: ${secondaryValue}g`;

        const isExpanded = expandedUserId === user.id;

        const dosesHTML = user.recentDoses.length === 0 
          ? `<div class="text-[11px] text-slate-500 italic py-0.5 text-center">Žádné dávky</div>`
          : user.recentDoses.map(item => {
              const rawTimestamp = item.timestamp || item.created_at;
              const dateObj = new Date(rawTimestamp);
              let dayName = dateObj.toLocaleDateString('cs-CZ', { weekday: 'long' });
              dayName = dayName.charAt(0).toUpperCase() + dayName.slice(1);
              const formattedTime = dateObj.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });
              const gramsValue = parseFloat(item.grams !== undefined ? item.grams : item.amount) || 0;
              return `
                <div class="flex items-center justify-between text-xs bg-slate-900/65 px-2.5 py-1 rounded-lg border border-borderbg/40">
                  <span class="text-slate-300 font-medium flex items-center gap-1.5">
                    <i class="fa-regular fa-clock text-[10px] text-amber-400/70"></i> ${dayName} ${formattedTime}
                  </span>
                  <span class="font-black text-amber-400 font-mono text-xs">${gramsValue.toFixed(2)} g</span>
                </div>
              `;
            }).join('');

        const avatarHTML = user.avatarUrl 
          ? `<img src="${user.avatarUrl}" alt="${user.name}" class="w-7 h-7 rounded-lg object-cover border border-borderbg/80 shrink-0">`
          : `<div class="w-7 h-7 rounded-lg bg-darkbg border border-borderbg/80 flex items-center justify-center text-slate-500 text-xs shrink-0"><i class="fa-solid fa-user"></i></div>`;

        return `
          <div class="bg-darkbg/70 border ${cardBorder} rounded-xl overflow-hidden text-xs transition-all hover:bg-darkbg">
            <div onclick="toggleUserDetails('${user.id}')" class="p-2.5 flex justify-between items-center cursor-pointer select-none">
              <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-lg border flex items-center justify-center text-xs font-bold shrink-0 ${badgeStyle}">
                  ${rankIcon}
                </div>

                ${avatarHTML}

                <div>
                  <div class="flex items-center gap-1.5 flex-wrap leading-tight">
                    <span class="font-bold text-white text-xs">${user.name}</span>
                    <i id="chev-${user.id}" class="fa-solid fa-chevron-down text-[9px] text-slate-500 transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}"></i>
                    ${rankBadgeHTML}
                    ${youBadge}
                  </div>
                  <span class="text-[10px] text-slate-500 font-mono block mt-0.5">${secondaryLabel}</span>
                </div>
              </div>

              <div class="text-right shrink-0">
                <div class="font-black text-white text-sm leading-none">
                  ${primaryValue} <span class="text-[10px] font-normal text-brand-400">g</span>
                </div>
                <span class="text-[9px] uppercase font-semibold text-slate-500">${primaryUnit}</span>
              </div>
            </div>

            <div id="acc-${user.id}" class="details-accordion ${isExpanded ? 'open' : ''}">
              <div class="details-inner">
                <div class="pt-1.5 pb-2 px-2.5 border-t border-borderbg/40 bg-cardbg/50">
                  <div class="space-y-1">
                    ${dosesHTML}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    checkAuth();
  </script>
</body>
</html>
