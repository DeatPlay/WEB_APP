<!DOCTYPE html>
<html lang="cs" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leaderboard | Grammi</title>

  <!-- Tailwind CSS & FontAwesome & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              900: '#134e4a',
            },
            gold: '#fbbf24',
            silver: '#94a3b8',
            bronze: '#d97706',
            darkbg: '#0b0f17',
            cardbg: '#141c2b',
            borderbg: '#1e293b'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f17;
      color: #f1f5f9;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Scrollbar */
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #141c2b;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    /* Liquid Glass Pill Navigation */
    .liquid-glass-nav {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.6);
    }

    .liquid-pill {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.95) 0%, rgba(217, 119, 6, 0.9) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.45);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Ambient background gold glow */
    .ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, rgba(11, 15, 23, 0) 70%);
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body class="h-dvh flex justify-center p-2.5 pb-6 sm:p-4 sm:pb-7 select-none antialiased relative">

  <!-- Ambient Glow -->
  <div class="ambient-glow"></div>

  <div class="w-full max-w-md h-full flex flex-col justify-between gap-2.5 overflow-hidden relative z-10">

    <!-- Top Header -->
    <header class="flex justify-between items-center py-1 px-0.5 shrink-0">
      <div class="flex items-center gap-2.5">
        <a href="dashboard.html" class="w-9 h-9 rounded-xl bg-cardbg border border-borderbg flex items-center justify-center text-slate-300 hover:text-white transition-colors active:scale-95 shadow-md" title="Zpět na Dashboard">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </a>
        <div>
          <h1 class="font-extrabold text-lg tracking-tight text-white flex items-center gap-1.5 leading-none">
            Leaderboard
            <span class="text-amber-400 font-bold text-[10px] px-1.5 py-0.5 rounded-full bg-amber-500/10 border border-amber-500/20 flex items-center gap-1">
              <i class="fa-solid fa-crown text-[9px]"></i> TOP 10
            </span>
          </h1>
          <p class="text-[11px] text-slate-400 font-medium leading-tight mt-0.5">Globální pořadí komunity</p>
        </div>
      </div>

      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-slate-950 font-black text-sm shadow-lg shadow-amber-500/20">
        <i class="fa-solid fa-trophy"></i>
      </div>
    </header>

    <!-- Sorting Bar (Apple Liquid Pill) -->
    <div class="liquid-glass-nav rounded-2xl p-1 relative grid grid-cols-2 gap-0 shrink-0">
      <div 
        id="sort-pill" 
        class="liquid-pill absolute top-1 bottom-1 left-1 w-[calc(50%-0.25rem)] rounded-xl pointer-events-none"
      ></div>

      <button 
        id="btn-sort-total" 
        onclick="setSortMode('total')" 
        class="relative z-10 py-2 rounded-xl font-black text-xs flex items-center justify-center gap-1.5 transition-colors duration-300 text-slate-950"
      >
        <i class="fa-solid fa-layer-group text-xs"></i> Celkem gramů
      </button>

      <button 
        id="btn-sort-max" 
        onclick="setSortMode('max')" 
        class="relative z-10 py-2 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition-colors duration-300 text-slate-400 hover:text-white"
      >
        <i class="fa-solid fa-bolt-lightning text-xs"></i> Max. dávka
      </button>
    </div>

    <!-- Leaderboard List Card -->
    <div class="bg-cardbg border border-borderbg rounded-2xl p-3 shadow-xl flex-1 flex flex-col overflow-hidden">
      
      <!-- List Header / Subtitle -->
      <div class="flex justify-between items-center mb-2 pb-2 border-b border-borderbg/60 shrink-0 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
        <span>Uživatel & Pořadí</span>
        <span id="sort-indicator-label">Celkem (Max)</span>
      </div>

      <!-- Scrollable Top 10 Container -->
      <div id="leaderboard-list" class="space-y-1.5 flex-1 overflow-y-auto custom-scroll pr-1">
        <!-- Dynamically rendered -->
      </div>
    </div>

    <!-- Bottom Back to Dashboard Action -->
    <a 
      href="dashboard.html" 
      class="w-full py-2.5 bg-darkbg hover:bg-slate-800/80 border border-borderbg rounded-2xl text-xs font-bold text-slate-300 flex items-center justify-center gap-2 transition-all active:scale-[0.98] shadow-md shrink-0 mb-1"
    >
      <i class="fa-solid fa-arrow-left text-brand-400 text-xs"></i> Zpět do přehledu
    </a>

  </div>

  <script>
    // Demo data prvních 10 uživatelů pro frontend
    let leaderboardData = [
      { id: 1, name: "David K.", email: "david@example.com", totalGrams: 148.50, maxDose: 4.80 },
      { id: 2, name: "Petr N.", email: "petr@example.com", totalGrams: 122.20, maxDose: 5.00 },
      { id: 3, name: "Marek V.", email: "marek@example.com", totalGrams: 98.40, maxDose: 3.50 },
      { id: 4, name: "Honza Š.", email: "honza@example.com", totalGrams: 84.10, maxDose: 4.20 },
      { id: 5, name: "Tomáš B.", email: "tomas@example.com", totalGrams: 72.80, maxDose: 3.00 },
      { id: 6, name: "Lukáš M.", email: "lukas@example.com", totalGrams: 65.50, maxDose: 2.80 },
      { id: 7, name: "Jakub K.", email: "jakub@example.com", totalGrams: 54.00, maxDose: 3.20 },
      { id: 8, name: "Filip R.", email: "filip@example.com", totalGrams: 42.60, maxDose: 2.50 },
      { id: 9, name: "Martin D.", email: "martin@example.com", totalGrams: 31.20, maxDose: 2.20 },
      { id: 10, name: "Adam P.", email: "adam@example.com", totalGrams: 24.80, maxDose: 2.00 },
    ];

    let currentSort = 'total'; // 'total' nebo 'max'

    function setSortMode(mode) {
      currentSort = mode;
      const pill = document.getElementById('sort-pill');
      const btnTotal = document.getElementById('btn-sort-total');
      const btnMax = document.getElementById('btn-sort-max');
      const sortLabel = document.getElementById('sort-indicator-label');

      if (mode === 'total') {
        pill.style.transform = 'translateX(0%)';
        btnTotal.className = "relative z-10 py-2 rounded-xl font-black text-xs flex items-center justify-center gap-1.5 transition-colors duration-300 text-slate-950";
        btnMax.className = "relative z-10 py-2 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition-colors duration-300 text-slate-400 hover:text-white";
        sortLabel.textContent = "Celkem (Max)";
      } else {
        pill.style.transform = 'translateX(100%)';
        btnMax.className = "relative z-10 py-2 rounded-xl font-black text-xs flex items-center justify-center gap-1.5 transition-colors duration-300 text-slate-950";
        btnTotal.className = "relative z-10 py-2 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition-colors duration-300 text-slate-400 hover:text-white";
        sortLabel.textContent = "Max (Celkem)";
      }

      renderLeaderboard();
    }

    function renderLeaderboard() {
      const container = document.getElementById('leaderboard-list');

      // Řazení pole
      leaderboardData.sort((a, b) => {
        if (currentSort === 'total') {
          return b.totalGrams - a.totalGrams;
        } else {
          return b.maxDose - a.maxDose;
        }
      });

      container.innerHTML = leaderboardData.map((user, index) => {
        const rank = index + 1;
        
        // Stylování TOP 3
        let badgeStyle = "bg-slate-800 text-slate-400 border-borderbg";
        let cardBorder = "border-borderbg/80";
        let rankIcon = rank;

        if (rank === 1) {
          badgeStyle = "bg-amber-400/20 text-amber-300 border-amber-400/40 shadow-sm shadow-amber-500/20 font-black";
          cardBorder = "border-amber-400/40 bg-gradient-to-r from-amber-500/10 to-darkbg/80";
          rankIcon = `<i class="fa-solid fa-crown text-amber-400 text-[11px]"></i>`;
        } else if (rank === 2) {
          badgeStyle = "bg-slate-300/20 text-slate-200 border-slate-300/40 font-black";
          cardBorder = "border-slate-300/30 bg-gradient-to-r from-slate-400/10 to-darkbg/80";
          rankIcon = `<i class="fa-solid fa-medal text-slate-300 text-[11px]"></i>`;
        } else if (rank === 3) {
          badgeStyle = "bg-amber-700/20 text-amber-500 border-amber-700/40 font-black";
          cardBorder = "border-amber-700/30 bg-gradient-to-r from-amber-800/10 to-darkbg/80";
          rankIcon = `<i class="fa-solid fa-medal text-amber-600 text-[11px]"></i>`;
        }

        const primaryValue = currentSort === 'total' ? user.totalGrams.toFixed(2) : user.maxDose.toFixed(2);
        const secondaryValue = currentSort === 'total' ? user.maxDose.toFixed(2) : user.totalGrams.toFixed(2);
        const primaryUnit = currentSort === 'total' ? 'g celkem' : 'g max';
        const secondaryLabel = currentSort === 'total' ? `max: ${secondaryValue}g` : `celkem: ${secondaryValue}g`;

        return `
          <div class="bg-darkbg/70 border ${cardBorder} rounded-xl p-2.5 flex justify-between items-center text-xs transition-all hover:bg-darkbg">
            <div class="flex items-center gap-2.5">
              <div class="w-7 h-7 rounded-lg border flex items-center justify-center text-xs font-bold ${badgeStyle}">
                ${rankIcon}
              </div>
              <div>
                <span class="font-bold text-white text-xs block leading-tight">${user.name}</span>
                <span class="text-[10px] text-slate-500 font-mono">${secondaryLabel}</span>
              </div>
            </div>

            <div class="text-right">
              <div class="font-black text-white text-sm leading-none">
                ${primaryValue} <span class="text-[10px] font-normal text-brand-400">g</span>
              </div>
              <span class="text-[9px] uppercase font-semibold text-slate-500">${primaryUnit}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // Prvotní vykreslení
    renderLeaderboard();
  </script>
</body>
</html>
