<!DOCTYPE html>
<html lang="cs" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="view-transition" content="same-origin">
  <title>Leaderboard | Grammi</title>

  <!-- Tailwind CSS & FontAwesome & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind.config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Vlastní styly -->
  <link rel="stylesheet" href="style.css">
</head>
<body id="main-body" class="h-dvh flex justify-center p-2.5 pb-6 sm:p-4 sm:pb-7 select-none antialiased relative">

  <div class="ambient-glow"></div>

  <div id="leaderboard-wrapper" class="w-full max-w-md h-full flex flex-col justify-between gap-2.5 overflow-hidden relative z-10 page-slide-in-right">

    <header class="flex justify-between items-center py-1 px-0.5 shrink-0">
      <div class="flex items-center gap-2.5">
        <button onclick="navigateBack('dashboard.html?from=leaderboard')" class="w-9 h-9 rounded-xl bg-cardbg border border-borderbg flex items-center justify-center text-slate-300 hover:text-white transition-colors active:scale-95 shadow-md cursor-pointer" title="Zpět na Dashboard">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <div>
          <h1 class="font-extrabold text-lg tracking-tight text-white flex items-center gap-1.5 leading-none">
            Leaderboard
            <span class="text-amber-400 font-bold text-[10px] px-1.5 py-0.5 rounded-full bg-amber-500/10 border border-amber-500/20 flex items-center gap-1">
              <i class="fa-solid fa-crown text-[9px]"></i> TOP 10
            </span>
          </h1>
          <p class="text-[11px] text-slate-400 font-medium leading-tight mt-0.5">Celkové pořadí</p>
        </div>
      </div>

      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-slate-950 font-black text-sm shadow-lg shadow-amber-500/20">
        <i class="fa-solid fa-trophy"></i>
      </div>
    </header>

    <div class="liquid-glass-nav rounded-2xl p-1 relative grid grid-cols-2 gap-0 shrink-0">
      <div 
        id="sort-pill" 
        class="liquid-pill absolute top-1 bottom-1 left-1 w-[calc(50%-0.25rem)] rounded-xl pointer-events-none"
      ></div>

      <button 
        id="btn-sort-total" 
        onclick="setSortMode('total')" 
        class="relative z-10 py-2 rounded-xl font-black text-xs flex items-center justify-center gap-1.5 transition-colors duration-300 text-slate-950 cursor-pointer"
      >
        <i class="fa-solid fa-layer-group text-xs"></i> Celkem gramů
      </button>

      <button 
        id="btn-sort-max" 
        onclick="setSortMode('max')" 
        class="relative z-10 py-2 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition-colors duration-300 text-slate-400 hover:text-white cursor-pointer"
      >
        <i class="fa-solid fa-bolt-lightning text-xs"></i> Max. Gcek
      </button>
    </div>

    <div class="bg-cardbg border border-borderbg rounded-2xl p-3 shadow-xl flex-1 flex flex-col overflow-hidden">
      <div class="flex justify-between items-center mb-2 pb-2 border-b border-borderbg/60 shrink-0 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
        <span>Uživatel & Pořadí</span>
        <span id="sort-indicator-label">Celkem (Max)</span>
      </div>

      <div id="leaderboard-list" class="space-y-1.5 flex-1 overflow-y-auto custom-scroll pr-1">
        <div class="text-center py-8 text-slate-500 text-xs flex flex-col items-center justify-center gap-2">
          <i class="fa-solid fa-spinner fa-spin text-lg text-amber-400"></i>
          Načítám žebříček z databáze...
        </div>
      </div>
    </div>

    <button 
      type="button"
      onclick="navigateBack('dashboard.html?from=leaderboard')" 
      class="w-full py-2.5 bg-darkbg hover:bg-slate-800/80 border border-borderbg rounded-2xl text-xs font-bold text-slate-300 flex items-center justify-center gap-2 transition-all active:scale-[0.98] shadow-md shrink-0 mb-1 cursor-pointer"
    >
      <i class="fa-solid fa-arrow-left text-brand-400 text-xs"></i> Zpět do přehledu
    </button>
  </div>

  <!-- Skripty -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="leaderboard.js"></script>
</body>
</html>
