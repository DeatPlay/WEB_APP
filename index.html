<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Přihlášení do systému</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border-color: #334155;
      --error-color: #ef4444;
      --success-color: #22c55e;
      --input-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .alert-error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error-color);
      color: #fca5a5;
    }

    .alert-success {
      background-color: rgba(34, 197, 94, 0.15);
      border: 1px solid var(--success-color);
      color: #86efac;
    }

    .spinner {
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 2px solid white;
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <h1>Přihlášení</h1>
      <p>Zadejte své přihlašovací údaje</p>
    </div>

    <!-- Místo pro hlášky -->
    <div id="alertBox" class="alert"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="např. admin@test.cz" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password">Heslo</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        >
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <div id="btnSpinner" class="spinner"></div>
        <span id="btnText">Přihlásit se</span>
      </button>
    </form>
  </div>

  <!-- Načtení oficiální Supabase JS knihovny -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // =========================================================================
    // NASTAVENÍ: Vlož sem své údaje z administrace Supabase (Krok 4)
    // =========================================================================
    const SUPABASE_URL = "https://emzqqvoqqodaggskgfze.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_rYu-TFnQacUrnmdNVRZ3Zw_wR3r_u4W";

    // Inicializace Supabase klienta
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleLogin(event) {
      event.preventDefault();

      const emailInput = document.getElementById("email").value.trim();
      const passwordInput = document.getElementById("password").value;
      const alertBox = document.getElementById("alertBox");
      const submitBtn = document.getElementById("submitBtn");
      const btnSpinner = document.getElementById("btnSpinner");
      const btnText = document.getElementById("btnText");

      // Skrytí předchozí hlášky
      alertBox.style.display = "none";
      alertBox.textContent = "";
      alertBox.className = "alert";

      // Aktivace načítacího stavu tlačítka
      submitBtn.disabled = true;
      btnSpinner.style.display = "inline-block";
      btnText.textContent = "Ověřuji...";

      try {
        // Dotaz na PostgreSQL Auth v Supabase
        const { data, error } = await db.auth.signInWithPassword({
          email: emailInput,
          password: passwordInput,
        });

        if (error) {
          showError("Neplatný e-mail nebo heslo.");
          return;
        }

        if (data.session) {
          // Úspěch – uložíme session token
          sessionStorage.setItem("authToken", data.session.access_token);
          sessionStorage.setItem("currentUser", data.user.email);

          showSuccess("Přihlášení úspěšné! Přesměrovávám...");

          // Přesměrování na hlavní stránku (pokud ji máš vytvořenou)
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1000);
        }
      } catch (err) {
        showError("Chyba při komunikaci s databází.");
      } finally {
        resetButton();
      }
    }

    function showError(message) {
      const alertBox = document.getElementById("alertBox");
      alertBox.textContent = message;
      alertBox.className = "alert alert-error";
      alertBox.style.display = "block";
    }

    function showSuccess(message) {
      const alertBox = document.getElementById("alertBox");
      alertBox.textContent = message;
      alertBox.className = "alert alert-success";
      alertBox.style.display = "block";
    }

    function resetButton() {
      const submitBtn = document.getElementById("submitBtn");
      const btnSpinner = document.getElementById("btnSpinner");
      const btnText = document.getElementById("btnText");

      submitBtn.disabled = false;
      btnSpinner.style.display = "none";
      btnText.textContent = "Přihlásit se";
    }
  </script>
</body>
</html>
