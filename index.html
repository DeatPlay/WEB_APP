<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Přihlášení</title>
</head>
<body>
  <h2>Zadejte heslo pro přístup</h2>
  
  <input type="password" id="passwordInput" placeholder="Heslo">
  <button onclick="checkPassword()">Vstoupit</button>
  <p id="errorMsg" style="color: red;"></p>

  <script>
    function checkPassword() {
      const enteredPassword = document.getElementById("passwordInput").value;
      const correctPassword = "mojeHeslo123"; // Vaše heslo

      if (enteredPassword === correctPassword) {
        // Uložení stavu přihlášení do paměti prohlížeče
        sessionStorage.setItem("isLoggedIn", "true");
        // Přesměrování na hlavní obsah
        window.location.href = "app.html";
      } else {
        document.getElementById("errorMsg").textContent = "Nesprávné heslo!";
      }
    }
  </script>
</body>
</html>
