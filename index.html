<!DOCTYPE html>
<html lang="cs" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Přihlášení | Grammi</title>

  <!-- Tailwind CSS & FontAwesome & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind.config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Vlastní styly -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-dvh flex justify-center p-4 pb-6 sm:p-6 sm:pb-8 select-none antialiased relative">

  <div class="ambient-glow"></div>

  <div class="w-full max-w-sm h-full flex flex-col justify-between relative z-10">
    <div class="shrink-0 h-4"></div>

    <div class="w-full my-auto flex flex-col gap-10">
      <div class="flex flex-col items-center text-center">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center text-slate-950 font-black text-3xl shadow-xl shadow-brand-500/20 mb-4 transition-transform duration-300 hover:scale-105">
          <i class="fa-solid fa-mortar-pestle"></i>
        </div>
        
        <h1 class="font-extrabold text-2xl tracking-tight text-white flex items-center gap-2 leading-none">
          Grammi
          <span class="text-brand-400 font-semibold text-[11px] px-2 py-0.5 rounded-full bg-brand-500/10 border border-brand-500/20">
            v0.9_4
          </span>
        </h1>
        <p class="text-xs text-slate-400 font-medium mt-2">Přihlaste se ke svému účtu</p>
      </div>

      <div id="alertBox" class="hidden text-xs font-semibold py-3 px-4 rounded-2xl border transition-all text-center"></div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label for="email" class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">
            E-mail
          </label>
          <div class="relative flex items-center">
            <span class="absolute left-4 text-slate-500 text-sm pointer-events-none">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="vas@email.cz" 
              required 
              autocomplete="email"
              class="w-full bg-cardbg/80 border border-borderbg rounded-2xl py-3 pl-11 pr-4 text-sm font-semibold text-white placeholder:text-slate-600 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all shadow-inner"
            >
          </div>
        </div>

        <div>
          <label for="password" class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">
            Heslo
          </label>
          <div class="relative flex items-center">
            <span class="absolute left-4 text-slate-500 text-sm pointer-events-none">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
              class="w-full bg-cardbg/80 border border-borderbg rounded-2xl py-3 pl-11 pr-4 text-sm font-semibold text-white placeholder:text-slate-600 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all shadow-inner"
            >
          </div>
        </div>

        <button 
          type="submit" 
          id="submitBtn" 
          class="w-full py-3.5 bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-400 text-slate-950 font-extrabold rounded-2xl shadow-lg shadow-brand-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-xs uppercase tracking-wider mt-2 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed"
        >
          <div id="btnSpinner" class="spinner"></div>
          <span id="btnText">Přihlásit se</span>
        </button>
      </form>
    </div>

    <div class="text-center pb-2 shrink-0">
      <p class="text-[11px] text-slate-500 font-medium">Grammi • DP</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
