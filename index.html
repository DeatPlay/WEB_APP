<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Přihlášení do systému</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border-color: #334155;
      --error-color: #ef4444;
      --input-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .alert-error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error-color);
      color: #fca5a5;
    }

    .spinner {
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 2px solid white;
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <h1>Přihlášení</h1>
      <p>Zadejte své přihlašovací údaje</p>
    </div>

    <!-- Místo pro chybové hlášky -->
    <div id="alertBox" class="alert alert-error"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Uživatelské jméno</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="např. admin" 
          required 
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="password">Heslo</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        >
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <div id="btnSpinner" class="spinner"></div>
        <span id="btnText">Přihlásit se</span>
      </button>
    </form>
  </div>

  <script>
    // URL vašeho budoucího backend API (např. https://moje-api.cz/api/login)
    const API_LOGIN_URL = null; // Až bude backend hotový, nastavte sem URL: "https://vase-api/api/login"

    async function handleLogin(event) {
      event.preventDefault();

      const usernameInput = document.getElementById("username").value.trim();
      const passwordInput = document.getElementById("password").value;
      const alertBox = document.getElementById("alertBox");
      const submitBtn = document.getElementById("submitBtn");
      const btnSpinner = document.getElementById("btnSpinner");
      const btnText = document.getElementById("btnText");

      // Skrytí předchozí chyby
      alertBox.style.display = "none";
      alertBox.textContent = "";

      // Aktivace načítacího stavu
      submitBtn.disabled = true;
      btnSpinner.style.display = "inline-block";
      btnText.textContent = "Ověřuji...";

      // =========================================================================
      // VARIANTA A: Připraveno pro ostré Backend API + SQL Databázi
      // =========================================================================
      if (API_LOGIN_URL) {
        try {
          const response = await fetch(API_LOGIN_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              username: usernameInput,
              password: passwordInput
            })
          });

          const data = await response.json();

          if (response.ok && data.token) {
            // Uložení JWT tokenu / session z backendu
            sessionStorage.setItem("authToken", data.token);
            sessionStorage.setItem("currentUser", usernameInput);
            
            // Přesměrování do hlavní aplikace
            window.location.href = "dashboard.html";
          } else {
            showError(data.message || "Neplatné přihlašovací jméno nebo heslo.");
          }
        } catch (err) {
          showError("Nepodařilo se připojit k serveru. Zkuste to znovu.");
        } finally {
          resetButton();
        }
        return;
      }

      // =========================================================================
      // VARIANTA B: Dočasný režim (než zprovozníte backend s SQL)
      // =========================================================================
      setTimeout(() => {
        // Zde můžete nastavit dočasné údaje pro testování
        const MOCK_USER = "admin";
        const MOCK_PASS = "heslo123";

        if (usernameInput === MOCK_USER && passwordInput === MOCK_PASS) {
          sessionStorage.setItem("authToken", "demo_token_123");
          sessionStorage.setItem("currentUser", usernameInput);
          window.location.href = "dashboard.html";
        } else {
          showError("Nesprávné uživatelské jméno nebo heslo.");
          resetButton();
        }
      }, 600); // Simulace síťového zpoždění
    }

    function showError(message) {
      const alertBox = document.getElementById("alertBox");
      alertBox.textContent = message;
      alertBox.style.display = "block";
    }

    function resetButton() {
      const submitBtn = document.getElementById("submitBtn");
      const btnSpinner = document.getElementById("btnSpinner");
      const btnText = document.getElementById("btnText");

      submitBtn.disabled = false;
      btnSpinner.style.display = "none";
      btnText.textContent = "Přihlásit se";
    }
  </script>
</body>
</html>
