<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tmavá Vektorová Mapa</title>
  
  <!-- MapLibre GL JS CSS & Script -->
  <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* Stylování ovládacích prvků do tmavého režimu */
    .maplibregl-ctrl-group {
      background: #1e293b !important;
      border: 1px solid #334155 !important;
      border-radius: 8px !important;
      overflow: hidden;
    }
    .maplibregl-ctrl-group button {
      border-bottom: 1px solid #334155 !important;
    }
    .maplibregl-ctrl-icon {
      filter: invert(1);
    }
    
    /* Vlastní popup v tmavém stylu */
    .maplibregl-popup-content {
      background: #1e293b !important;
      color: #f8fafc !important;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }
    .maplibregl-popup-tip {
      border-top-color: #1e293b !important;
    }
    .maplibregl-popup-close-button {
      color: #94a3b8;
      padding: 4px 8px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      // Vektorový styl Carto Dark Matter (volně dostupný JSON)
      style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center: [17.25, 49.59], // [délka, šířka]
      zoom: 12,
      pitch: 35,              // 3D náklon pro prostorový efekt
      bearing: 0,
      antialias: true
    });

    // Ovládání zoomu a rotace
    map.addControl(new maplibregl.NavigationControl({
      visualizePitch: true
    }), 'top-right');

    // Tlačítko pro geolokaci uživatele
    map.addControl(new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true
    }), 'top-right');

    // Příklad vlastního markeru s popupem
    const popup = new maplibregl.Popup({ offset: 25 })
      .setHTML('<h3 style="font-size:14px; margin-bottom:4px; color:#38bdf8;">Vybrané místo</h3><p style="font-size:12px; color:#cbd5e1;">Kliknutím můžete přidat další interakce.</p>');

    new maplibregl.Marker({ color: '#38bdf8' })
      .setLngLat([17.25, 49.59])
      .setPopup(popup)
      .addTo(map);
  </script>
</body>
</html>
