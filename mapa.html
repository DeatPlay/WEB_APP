<!DOCTYPE html>
<html lang="cs" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="view-transition" content="same-origin">
  <title>Mapa | Grammi</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              900: '#134e4a',
            },
            darkbg: '#0b0f17',
            cardbg: '#141c2b',
            borderbg: '#1e293b'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f17;
      color: #f1f5f9;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.28s ease;
    }

    .page-slide-in-right {
      animation: slideInFromRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideInFromRight {
      from { transform: translateX(35px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .page-slide-out-right {
      transform: translateX(35px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
    }

    .leaflet-container {
      background-color: #0b0f17 !important;
      outline: none;
    }
    .grammi-dark-tiles {
      filter: contrast(1.15) brightness(0.95);
    }

    /* Vlastní styl Popup okna na mapě */
    .leaflet-popup-content-wrapper {
      background: #141c2b !important;
      color: #f1f5f9 !important;
      border: 1px solid #1e293b !important;
      border-radius: 16px !important;
      box-shadow: 0 16px 35px -5px rgba(0, 0, 0, 0.75) !important;
      padding: 4px 6px !important;
    }
    .leaflet-popup-tip {
      background: #141c2b !important;
      border: 1px solid #1e293b !important;
    }
    .leaflet-popup-close-button {
      color: #64748b !important;
      padding: 6px !important;
    }

    /* Ovládání Zoomu */
    .leaflet-bar {
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      border-radius: 14px !important;
      overflow: hidden;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.7) !important;
    }
    .leaflet-bar a {
      background-color: #141c2b !important;
      color: #2dd4bf !important;
      border-bottom: 1px solid #1e293b !important;
      width: 34px !important;
      height: 34px !important;
      line-height: 34px !important;
      font-weight: 800 !important;
    }
    .leaflet-bar a:hover {
      background-color: #1e293b !important;
      color: #ffffff !important;
    }

    .ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(20, 184, 166, 0.12) 0%, rgba(11, 15, 23, 0) 70%);
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body id="main-body" class="h-dvh flex justify-center p-2.5 pb-6 sm:p-4 sm:pb-7 select-none antialiased relative">

  <div class="ambient-glow"></div>

  <div id="mapa-wrapper" class="w-full max-w-md h-full flex flex-col justify-between gap-2.5 overflow-hidden relative z-10 page-slide-in-right">

    <!-- Top Header -->
    <header class="flex justify-between items-center py-1 px-0.5 shrink-0">
      <div class="flex items-center gap-2.5">
        <button onclick="navigateBack('dashboard.html?from=leaderboard')" class="w-9 h-9 rounded-xl bg-cardbg border border-borderbg flex items-center justify-center text-slate-300 hover:text-white transition-colors active:scale-95 shadow-md cursor-pointer" title="Zpět na Dashboard">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <div>
          <h1 class="font-extrabold text-lg tracking-tight text-white flex items-center gap-1.5 leading-none">
            Mapa dávek
            <span id="markers-count-badge" class="text-brand-400 font-bold text-[10px] px-1.5 py-0.5 rounded-full bg-brand-500/10 border border-brand-500/20 flex items-center gap-1">
              <i class="fa-solid fa-location-dot text-[9px]"></i> 0 bodů
            </span>
          </h1>
          <p class="text-[11px] text-slate-400 font-medium leading-tight mt-0.5">Zaznamenané lokace</p>
        </div>
      </div>

      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center text-slate-950 font-black text-sm shadow-lg shadow-brand-500/20">
        <i class="fa-solid fa-map-location-dot"></i>
      </div>
    </header>

    <!-- Mapa Card -->
    <div class="bg-cardbg border border-borderbg rounded-3xl p-1.5 shadow-2xl flex-1 flex flex-col overflow-hidden relative">
      <div id="map" class="w-full h-full rounded-2xl overflow-hidden z-0"></div>

      <!-- Tlačítka rychlé akce na mapě -->
      <div class="absolute bottom-4 right-4 z-[400] flex items-center gap-2">
        <button 
          onclick="resetMapBounds()" 
          class="px-3 py-2 bg-cardbg/95 hover:bg-slate-800 border border-brand-500/30 text-brand-400 font-extrabold text-xs rounded-xl shadow-2xl backdrop-blur-md transition-all active:scale-95 flex items-center gap-1.5 cursor-pointer"
          title="Zobrazit všechny body nebo ČR"
        >
          <i class="fa-solid fa-expand text-brand-400 text-xs"></i> Vše
        </button>
      </div>
    </div>

    <!-- Zpět Button -->
    <button 
      type="button"
      onclick="navigateBack('dashboard.html?from=leaderboard')" 
      class="w-full py-2.5 bg-darkbg hover:bg-slate-800/80 border border-borderbg rounded-2xl text-xs font-bold text-slate-300 flex items-center justify-center gap-2 transition-all active:scale-[0.98] shadow-md shrink-0 mb-1 cursor-pointer"
    >
      <i class="fa-solid fa-arrow-left text-brand-400 text-xs"></i> Zpět do přehledu
    </button>

  </div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://emzqqvoqqodaggskgfze.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_rYu-TFnQacUrnmdNVRZ3Zw_wR3r_u4W";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        storage: window.localStorage,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    let map = null;
    let currentUserId = null;
    let markersLayer = null;

    async function checkAuth() {
      try {
        const { data: { session }, error } = await db.auth.getSession();
        if (error || !session) {
          window.location.replace("index.html");
          return;
        }
        currentUserId = session.user.id;
      } catch(e) {}

      document.getElementById('main-body').style.display = 'flex';
      initMap();
      await loadDoseMarkers();
    }

    function navigateBack(url) {
      const wrapper = document.getElementById('mapa-wrapper');
      wrapper.classList.remove('page-slide-in-right');
      wrapper.classList.add('page-slide-out-right');
      setTimeout(() => {
        window.location.href = url;
      }, 220);
    }

    function initMap() {
      if (map) return;

      map = L.map('map', {
        zoomControl: true,
        attributionControl: false
      }).setView([49.8175, 15.4730], 7);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        minZoom: 6,
        subdomains: 'abcd'
      }).addTo(map);

      markersLayer = L.featureGroup().addTo(map);

      setTimeout(() => {
        map.invalidateSize();
      }, 250);
    }

    // Načtení bodů s GPS souřadnicemi a jejich zobrazení na mapě
    async function loadDoseMarkers() {
      try {
        const { data, error } = await db
          .from('doses')
          .select('id, amount, note, timestamp, latitude, longitude')
          .not('latitude', 'is', null)
          .not('longitude', 'is', null)
          .order('timestamp', { ascending: false });

        if (error) throw error;

        markersLayer.clearLayers();
        const badge = document.getElementById('markers-count-badge');
        if (badge) badge.innerHTML = `<i class="fa-solid fa-location-dot text-[9px]"></i> ${(data || []).length} bodů`;

        if (!data || data.length === 0) return;

        data.forEach(dose => {
          const d = new Date(dose.timestamp);
          const dateStr = d.toLocaleDateString('cs-CZ', { day: 'numeric', month: 'numeric' });
          const timeStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

          const circle = L.circleMarker([dose.latitude, dose.longitude], {
            radius: 8,
            fillColor: '#2dd4bf',
            color: '#134e4a',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
          });

          const popupContent = `
            <div class="text-xs p-1">
              <div class="flex items-center justify-between gap-3 border-b border-slate-700/60 pb-1.5 mb-1.5">
                <span class="font-extrabold text-white text-sm">${parseFloat(dose.amount).toFixed(2)} <span class="text-brand-400 font-semibold text-xs">g</span></span>
                <span class="text-[10px] text-slate-400 font-mono">${dateStr} • ${timeStr}</span>
              </div>
              ${dose.note ? `<p class="text-[11px] text-slate-300 italic mb-1"><i class="fa-regular fa-comment text-[9px] text-brand-400 mr-1"></i>${dose.note}</p>` : ''}
              
              <div class="flex justify-end pt-1.5 mt-1 border-t border-slate-700/50">
                <button 
                  onclick="deleteDoseLocation('${dose.id}')" 
                  class="text-slate-400 hover:text-red-400 text-[10px] flex items-center gap-1.5 py-1 px-2 rounded-lg bg-slate-800/60 hover:bg-red-500/10 border border-slate-700/60 hover:border-red-500/30 transition-all cursor-pointer"
                  title="Odebrat pouze polohu"
                >
                  <i class="fa-regular fa-trash-can text-red-400 text-[10px]"></i> Smazat lokaci
                </button>
              </div>
            </div>
          `;

          circle.bindPopup(popupContent);
          markersLayer.addLayer(circle);
        });

        if (data.length > 0) {
          map.fitBounds(markersLayer.getBounds(), { padding: [40, 40], maxZoom: 14 });
        }
      } catch (err) {
        console.error('Chyba při načítání bodů na mapě:', err);
      }
    }

    // Smazání pouze polohy dané dávky (dávka zůstane v DB)
    window.deleteDoseLocation = async function(id) {
      if (!confirm('Opravdu chcete odebrat záznam o poloze pro tuto dávku? Samotná dávka v historii zůstane.')) return;

      try {
        const { data, error } = await db
          .from('doses')
          .update({ latitude: null, longitude: null })
          .eq('id', id)
          .eq('user_id', currentUserId)
          .select();

        if (error) throw error;

        map.closePopup();
        await loadDoseMarkers();
      } catch (err) {
        console.error('Chyba při odstraňování lokace:', err);
        alert('Nepodařilo se odebrat lokaci. Ujistěte se, že máte v Supabase povoleno pravidlo UPDATE pro tabulku doses.');
      }
    };

    function resetMapBounds() {
      if (markersLayer && markersLayer.getLayers().length > 0) {
        map.fitBounds(markersLayer.getBounds(), { padding: [40, 40], maxZoom: 14 });
      } else if (map) {
        map.setView([49.8175, 15.4730], 7);
      }
    }

    checkAuth();
  </script>
</body>
</html>
